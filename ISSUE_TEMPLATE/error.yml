name: Error
description: Algo no funciona como debería
labels: ["tipo:error"]
body:
  - type: textarea
    id: que-paso
    attributes:
      label: Qué pasó
      description: Qué esperabas y qué pasó en cambio.
    validations:
      required: true
  - type: textarea
    id: como-reproducir
    attributes:
      label: Cómo reproducirlo
      description: Comandos exactos, config y commit.
      render: shell
    validations:
      required: true
  - type: input
    id: entorno
    attributes:
      label: Dónde corrió
      description: Clúster o máquina, GPU y versiones relevantes.
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Pega solo lo relevante y revisa que no haya tokens.
      render: text
